name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Hook tests
        run: python3 wealthink-plugin/hooks/tests/test_hooks.py

      - name: Install schema validator
        run: pip install jsonschema==4.23.0

      - name: Manifests parse and versions agree
        run: python3 .github/scripts/check_manifests.py

      - name: ChatGPT plugin package builds
        run: python3 .github/scripts/package_plugin.py dist/wealthink-plugin.zip

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace manifest
        run: claude plugin validate . --strict

      - name: Validate plugin manifest
        run: claude plugin validate ./wealthink-plugin --strict
