name: release

# Attach the ChatGPT / Codex plugin package to every published release, always
# named wealthink-plugin.zip, so its link never changes:
# https://github.com/Wealthink/wealthink-plugin/releases/latest/download/wealthink-plugin.zip

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only reviewed code ships: main is protected (PR + passing validate), so
      # a tag on any commit not merged to main is refused.
      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag $GITHUB_REF_NAME points at $GITHUB_SHA, which isn't on main. Merge first, then release from main."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install schema validator
        run: pip install jsonschema

      - name: Manifests parse and versions agree
        run: python3 .github/scripts/check_manifests.py

      - name: Tag matches the plugin version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("wealthink-plugin/plugin.json"))["version"])')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Release tag $GITHUB_REF_NAME doesn't match plugin version $version"
            exit 1
          fi

      - name: Build wealthink-plugin.zip
        run: python3 .github/scripts/package_plugin.py dist/wealthink-plugin.zip

      # Lets anyone check the zip came from this workflow:
      #   gh attestation verify wealthink-plugin.zip -R Wealthink/wealthink-plugin
      - name: Record build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/wealthink-plugin.zip

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/wealthink-plugin.zip --clobber
